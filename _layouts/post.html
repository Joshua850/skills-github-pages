---
layout: default
---

<article class="post">
  <a class="post__back" href="{{ '/' | relative_url }}">&larr; All posts</a>
  <header class="post__header">
    <time class="post__date" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    <h1 class="post__title">{{ page.title }}</h1>
  </header>
  <div class="post__body">
    {{ content }}
  </div>
  <footer class="post__footer">
    <a class="post__back" href="{{ '/' | relative_url }}">&larr; Back to all posts</a>
  </footer>
</article>
